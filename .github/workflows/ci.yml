name: CI

# Checks only. Deploying is deploy.yml, which triggers on the production branch
# alone. The comments here used to claim main deployed to prod, PRs deployed to
# dev and beta tags went to stage; none of that was true, and there is no dev or
# stage box to deploy to.
on:
  push:
    branches:
      - main

    tags:
      - '*-beta.*'

  pull_request:
    # production as well, so a promotion PR is checked before it can deploy.
    branches:
      - main
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx --bun tsc --noEmit

      # `tsc` above never opens a .stx file, so without this nothing checks the
      # script blocks or the {{ }} expressions that make up most of this app.
      #
      # NOT BLOCKING YET, deliberately. Measured baseline on 2026-08-18: 71
      # errors across 39 files, 0 warnings. 49 of those are TS2304 "cannot find
      # name", which is the class bughq eliminated by declaring its schema as
      # ambient types in a single `types/domain.d.ts` and passing it as --lib.
      # loghq has no such file yet, so the names a script block reads off the
      # server bridge are simply undeclared.
      #
      # This mirrors how bughq got there: warnings-only first, then flipped to
      # load-bearing once the count reached 0. Write types/domain.d.ts, drive
      # the count down, then delete `continue-on-error` and add the grep that
      # fails on anything but "0 error(s), 0 warning(s)".
      #
      # When that happens, note that --lib must be a SINGLE file: the checker
      # does not read ambient types from tsconfig `include`, and repeating the
      # flag silently drops all but the last (stacksjs/stx#1926).
      - name: Typecheck .stx (advisory)
        continue-on-error: true
        run: bunx --bun stx typecheck 'resources/**/*.stx'

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun run test

  # Was `publish-commit`, which ran ./storage/framework/scripts/publish-commit,
  # a path inside the gitignored vendored tree. `git ls-files storage/framework`
  # returns nothing, so that script cannot exist in a checkout and the step could
  # only ever fail. It never has, purely because it is pull_request-only and this
  # repo works direct-to-main; the first PR would have hit it.
  #
  # Publishing commit-tagged packages is framework scaffolding anyway: loghq is an
  # application and publishes nothing. The Build step below is the part worth
  # keeping: it is the only thing that runs `buddy build` on a PR, and a build
  # break is exactly what a PR should catch.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

