name: CI

# Checks only. Deploying is deploy.yml, which runs on the same push to main and
# gates itself on these checks. PRs and tags deploy nothing, and there is no dev
# or stage box to deploy to.
on:
  push:
    branches:
      - main

    tags:
      - '*-beta.*'

  pull_request:
    # production as well, so a promotion PR is checked before it can deploy.
    branches:
      - main
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          # Exact key only. A prefix fallback restored an older tree, `bun install`
          # left its stale nested @stacksjs copies in place (it does not prune), and
          # the first job saved that under the new lock's key, so the build got an
          # exact hit on a tree the lock does not describe. v2 skips that entry.
          key: node-modules-v2-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          # Exact key only. A prefix fallback restored an older tree, `bun install`
          # left its stale nested @stacksjs copies in place (it does not prune), and
          # the first job saved that under the new lock's key, so the build got an
          # exact hit on a tree the lock does not describe. v2 skips that entry.
          key: node-modules-v2-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx --bun tsc --noEmit

      # `tsc` above never opens a .stx file, so without this nothing checks the
      # script blocks or the {{ }} expressions that make up most of this app.
      #
      # BLOCKING since 2026-11-22. It ran advisory from 2026-08-18 (71 errors)
      # and stood at 62 errors when it was flipped. Most of those were names
      # loghq already declares in types/app.d.ts that the checker was never
      # given; the rest were real. Two were live bugs: settings.stx read
      # `repository` without listing it, so its client block threw a
      # ReferenceError and stopped every handler after it, and projects/new.stx
      # imported app/Support/projects one directory short, which the build
      # rendered as an error page.
      #
      # --lib is required, because the checker does not read ambient types from
      # tsconfig `include`. It may be REPEATED (stacksjs/stx#1926 is fixed).
      #
      # Warnings fail too. The only one this emits is "values reach this block
      # on the implicit bridge and are untyped", which is how a server value
      # reaches client code unchecked. `stx typecheck` exits 0 on warnings and
      # has no --fail-on-warning, hence the grep; errors it exits non-zero for,
      # which `set -o pipefail` carries through the tee. Same shape as bughq's.
      - name: Typecheck .stx
        run: |
          set -o pipefail
          bunx --bun stx typecheck 'resources/**/*.stx' --lib types/app.d.ts --lib types/stx-runtime.d.ts --lib types/render-context.d.ts | tee /tmp/stx-typecheck.log
          if ! grep -qE '0 error\(s\), 0 warning\(s\)' /tmp/stx-typecheck.log; then
            echo "::error::stx typecheck is not clean, see the log above"
            exit 1
          fi

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          # Exact key only. A prefix fallback restored an older tree, `bun install`
          # left its stale nested @stacksjs copies in place (it does not prune), and
          # the first job saved that under the new lock's key, so the build got an
          # exact hit on a tree the lock does not describe. v2 skips that entry.
          key: node-modules-v2-${{ hashFiles('**/bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun run test

  # Was `publish-commit`, which ran ./storage/framework/scripts/publish-commit,
  # a path inside the gitignored vendored tree. `git ls-files storage/framework`
  # returns nothing, so that script cannot exist in a checkout and the step could
  # only ever fail. It never has, purely because it is pull_request-only and this
  # repo works direct-to-main; the first PR would have hit it.
  #
  # Publishing commit-tagged packages is framework scaffolding anyway: loghq is an
  # application and publishes nothing. The Build step below is the part worth
  # keeping: it is the only thing that runs `buddy build` on a PR, and a build
  # break is exactly what a PR should catch.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          # Exact key only. A prefix fallback restored an older tree, `bun install`
          # left its stale nested @stacksjs copies in place (it does not prune), and
          # the first job saved that under the new lock's key, so the build got an
          # exact hit on a tree the lock does not describe. v2 skips that entry.
          key: node-modules-v2-${{ hashFiles('**/bun.lock') }}

      - name: Install Dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Build documentation
        run: bun buddy build docs

      - name: Validate documentation
        run: bun run docs:validate

      - name: Validate UI accessibility
        run: bun run ui:validate

      - name: Validate responsive visual contracts
        run: bun run visual:validate

      - name: Validate production release artifact
        run: bun run release:validate

      - name: Verify generated files are current
        run: git diff --exit-code
